# Essaim Hub 2.0.38. Load the Docker image first, then start from this directory:
#
#   docker load -i essaim-hub-2.0.38-docker-arm64.tar     (Raspberry Pi; use -amd64 on x86_64 PCs)
#   docker compose up -d
#
# The hub listens on http://MACHINE-IP:8420. Persistent state stays in the essaim-hub-data volume.
services:
  essaim-hub:
    image: essaim-hub:2.0.38
    container_name: essaim-hub
    restart: unless-stopped
    # Host network: lets the hub discover LAN workers and wake them via Wake-on-LAN.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Paris
      # Without Avahi on the host, the hub does not advertise essaim-hub.local; reach it by IP.
      ESSAIM_NO_AVAHI: "1"
    volumes:
      - essaim-hub-data:/data
      # Host machine ID for licensing (read-only).
      - /etc/machine-id:/etc/host-machine-id:ro
      # On Raspberry Pi, uncomment the line below to bind the license to the CPU serial number:
      # - /sys/firmware/devicetree/base/serial-number:/etc/essaim-serial:ro
      # Advertise essaim-hub.local via host Avahi: remove ESSAIM_NO_AVAHI above, create the hub
      # system user on the host (useradd --system --uid 10002 essaim-hub), then uncomment below.
      # - /run/dbus:/run/dbus
      # Remote access via Tailscale installed on the host (tailscale set --operator=essaim-hub):
      # - /usr/bin/tailscale:/usr/bin/tailscale:ro
      # - /run/tailscale:/run/tailscale

volumes:
  essaim-hub-data:
