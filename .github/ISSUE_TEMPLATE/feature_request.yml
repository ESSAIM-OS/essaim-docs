name: Feature Request
description: Suggest an improvement, new electricity tariff preset, miner integration, or feature for Essaim OS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Electricity Tariffs / Spot API / Currency
        - Miner Support / GPU Overclocking
        - Hub UI / Fleet Automation
        - Windows WSL2 / Bootable USB Rig
        - Mobile App / Telegram Bot
        - Documentation
  - type: textarea
    id: details
    attributes:
      label: What would you like to see?
      description: Describe the use case (for electricity tariffs, please specify country, utility plan name, time windows, and public API docs if available).
    validations:
      required: true
